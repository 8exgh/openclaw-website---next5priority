name: Build and Deploy Site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:latest
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Customer repos are openclaw-website---<slug>; the template repo itself
    # builds (CI validation) but never dispatches a deploy.
    if: >-
      startsWith(github.event.repository.name, 'openclaw-website---') &&
      vars.OC_SITE_PORT != '' &&
      vars.OC_SITE_SUBDOMAIN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Trigger devops deploy
        run: |
          REPO="${{ github.repository }}"           # 8exgh/openclaw-website---<slug>
          NAME="${REPO#*/}"
          curl --fail-with-body --show-error --silent -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository_owner }}/devops/dispatches \
            -d "{\"event_type\":\"deploy-openclaw-site\",\"client_payload\":{
                  \"name\":\"$NAME\",
                  \"image\":\"${{ env.REGISTRY }}/$REPO:latest\",
                  \"port\":\"${{ vars.OC_SITE_PORT }}\",
                  \"subdomain\":\"${{ vars.OC_SITE_SUBDOMAIN }}\",
                  \"claw\":\"${{ vars.OC_CLAW_USERNAME }}\",
                  \"sha\":\"${{ github.sha }}\"
                }}"
